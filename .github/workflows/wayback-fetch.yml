name: Descargar snapshot Wayback

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/wayback_*.py"
      - ".github/workflows/wayback-fetch.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/wayback_fetch.py archive-raw
      - run: python tools/wayback_deps.py archive-raw
      - name: Commit resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add archive-raw
          git commit -m "Snapshot Wayback de cainversiones.com (2018-08-05)" || echo "sin cambios"
          git push
